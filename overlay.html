<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>StreamBeats - Overlay</title>
<style>
  /* Overlay para o OBS (Fonte de Navegador). Fundo transparente.
     Opções no link: ?fila=1 (mostra as próximas)  ?lado=direita  ?sempre=1 (não some quando nada toca) */
  :root { --roxo: #9147ff; --verde: #1ed760; --rosa: #ff4fd8; --ease-out: cubic-bezier(.23, 1, .32, 1); }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff;
    user-select: none; -webkit-user-select: none; cursor: default; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .palco { padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .direita .palco { align-items: flex-end; }

  .cartao {
    position: relative; display: flex; gap: 14px; align-items: center;
    width: 460px; max-width: calc(100vw - 32px); box-sizing: border-box;
    padding: 12px 18px 12px 12px; border-radius: 18px;
    background: rgba(13, 11, 21, .86);
    box-shadow: 0 16px 36px -14px rgba(0, 0, 0, .75);
    transition: opacity 420ms var(--ease-out), transform 420ms var(--ease-out), filter 420ms var(--ease-out);
  }
  .cartao::before {
    content: ""; position: absolute; inset: 0; border-radius: 18px; padding: 1.5px;
    background: linear-gradient(120deg, var(--roxo), var(--rosa) 55%, var(--verde));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .escondido { opacity: 0; transform: translateY(14px); filter: blur(6px); }
  /* o momento principal: a música nova entra deslizando e saindo do desfoque */
  .entrando { animation: entra 620ms var(--ease-out); }
  @keyframes entra { from { opacity: 0; transform: translateX(-22px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .direita .entrando { animation-name: entraDir; }
  @keyframes entraDir { from { opacity: 0; transform: translateX(22px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

  .capa { width: 84px; height: 84px; border-radius: 12px; flex: none; background: #241b3a center/cover; box-shadow: 0 8px 18px -8px rgba(0, 0, 0, .7); }
  .info { flex: 1; min-width: 0; }
  .titulo { display: flex; align-items: center; gap: 9px; min-width: 0; }
  /* Equalizador: as barrinhas crescem com transform (scaleY), que o navegador do OBS anima à parte,
     sem depender do resto da página. Ele anima sempre que a música toca, mesmo com as animações do Windows desligadas. */
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; flex: none; }
  .eq i { display: block; width: 3px; height: 12px; background: var(--verde); border-radius: 2px;
    transform-origin: 50% 100%; transform: scaleY(.25); will-change: transform; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.33s; } .eq i:nth-child(3) { animation-delay: -.66s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .pausado .eq i { animation: none; transform: scaleY(.25); opacity: .6; }
  .nome { font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 2px 10px rgba(0, 0, 0, .6); }
  .artista { font-size: 15px; color: #fff; opacity: .86; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; text-shadow: 0 1px 2px rgba(0, 0, 0, .9); }
  .por { display: inline-block; margin-top: 7px; font-size: 13px; font-weight: 500; padding: 1px 10px; border-radius: 99px;
    color: #f4edff; background: rgba(145, 71, 255, .3); border: 1px solid rgba(201, 168, 255, .45); max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
  .barra { height: 3px; border-radius: 9px; background: rgba(255, 255, 255, .14); margin-top: 9px; overflow: hidden; }
  .barra div { height: 100%; width: 0; background: linear-gradient(90deg, var(--verde), #7dffb0); border-radius: 9px; transition: width 1s linear; }

  .fila { width: 460px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 10px 16px 11px; border-radius: 14px; background: rgba(13, 11, 21, .8); font-size: 14px;
    box-shadow: 0 12px 28px -14px rgba(0, 0, 0, .7); }
  .fila b { font-size: 12.5px; font-weight: 600; color: #cdb2ff; }
  .fila div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; color: #ece8f6; }
  .fila span { color: #b993ff; }

  /* menos movimento no Windows: só a entrada deslizando sai; o equalizador continua */
  @media (prefers-reduced-motion: reduce) { .entrando { animation: none; } }
</style>
</head>
<body>
<div class="palco">
  <div class="cartao escondido" id="cartao">
    <div class="capa" id="capa"></div>
    <div class="info">
      <div class="titulo"><span class="eq" title="tocando agora"><i></i><i></i><i></i></span><div class="nome" id="nome"></div></div>
      <div class="artista" id="artista"></div>
      <div class="por" id="por" hidden></div>
      <div class="barra"><div id="barra"></div></div>
    </div>
  </div>
  <div class="fila" id="fila" hidden></div>
</div>
<script>
const opc = new URLSearchParams(location.search);
if (opc.get('lado') === 'direita') document.body.classList.add('direita');
const mostrarFila = opc.get('fila') === '1';
const sempre = opc.get('sempre') === '1';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// ?demo=1: mostra um exemplo quando nada está tocando (usado na miniatura do painel)
const demo = opc.get('demo') === '1';
const EXEMPLO = {
  tocando: { uri: 'exemplo', nome: 'Eu Tenho Medo', artistas: 'Zé Vaqueiro', imagem: '/icone-512.png', pedidoPor: 'Lucas' },
  proximas: [
    { nome: 'Dynamite', artistas: 'BTS', pedidoPor: 'Lucas' },
    { nome: 'Numb', artistas: 'Linkin Park', pedidoPor: 'Gabriel' },
    { nome: 'Havana', artistas: 'Camila Cabello', pedidoPor: 'João' },
  ],
};
const ESPERA_PAUSA_MS = 3000; // pausa rápida não faz o overlay piscar
let uriAtual = null;
let est = null;
let visivel = false;
let pausadoDesde = 0;

function mostrarCartao(cartao) {
  cartao.classList.remove('escondido', 'entrando');
  void cartao.offsetWidth; // reinicia a animação
  cartao.classList.add('entrando');
  visivel = true;
}

let versaoDoApp = null;
async function atualizar() {
  try {
    est = await (await fetch('/overlay/estado', { cache: 'no-store' })).json();
  } catch {
    est = null;
  }
  // O app foi atualizado: recarrega o overlay pra pegar a versão nova (sem precisar mexer no OBS)
  if (est && est.versao) {
    if (versaoDoApp && est.versao !== versaoDoApp) { location.reload(); return; }
    versaoDoApp = est.versao;
  }
  if (demo && !(est && est.tocando)) {
    est = { ...EXEMPLO, player: { tocando: true, progresso: 82000, duracao: 200000, quando: Date.now() }, esconderPausado: false };
  }
  const t = est && est.tocando;
  const cartao = $('#cartao');
  if (!t) {
    if (!sempre) { cartao.classList.add('escondido'); visivel = false; }
    uriAtual = null;
  } else {
    const tocandoJa = !!(est.player && est.player.tocando);
    if (tocandoJa) pausadoDesde = 0; else if (!pausadoDesde) pausadoDesde = Date.now();
    // música pausada (ex.: o streamer foi jogar CS2): o overlay sai da tela e volta quando der play
    const sumir = est.esconderPausado !== false && !sempre && !!pausadoDesde && Date.now() - pausadoDesde > ESPERA_PAUSA_MS;
    const trocou = t.uri !== uriAtual;
    if (trocou) {
      uriAtual = t.uri;
      $('#capa').style.backgroundImage = t.imagem ? `url("${t.imagem}")` : 'url("/icone.png")';
      $('#nome').textContent = t.nome || t.titulo;
      $('#artista').textContent = t.artistas || '';
      $('#por').hidden = !t.pedidoPor;
      $('#por').textContent = t.pedidoPor ? 'pedida por ' + t.pedidoPor : '';
    }
    if (sumir) { cartao.classList.add('escondido'); visivel = false; }
    else if (trocou || !visivel) mostrarCartao(cartao);
    cartao.classList.toggle('pausado', !tocandoJa);
  }
  const f = $('#fila');
  const prox = (est && est.proximas) || [];
  f.hidden = !mostrarFila || !prox.length || !t || !visivel;
  if (!f.hidden) {
    f.innerHTML = '<b>A seguir</b>' + prox.map((p, i) =>
      `<div>${i + 1}. ${esc(p.nome || p.titulo)}${p.artistas ? ' - ' + esc(p.artistas) : ''}${p.pedidoPor ? ` <span>(${esc(p.pedidoPor)})</span>` : ''}</div>`).join('');
  }
}

function barra() {
  const p = est && est.player;
  if (!p || !p.duracao) { $('#barra').style.width = '0'; return; }
  const agora = Math.min(p.duracao, p.progresso + (p.tocando ? Date.now() - p.quando : 0));
  $('#barra').style.width = (agora / p.duracao * 100) + '%';
}
atualizar();
setInterval(atualizar, 1500);
setInterval(barra, 1000);
</script>
</body>
</html>
